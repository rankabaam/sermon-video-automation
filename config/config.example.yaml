# Public-safe sample configuration. All paths are relative to --root.
project:
  name: "Sermon Video Automation"
  display_title: "Sunday Message"
  description: "Repeatable Python and FFmpeg media preparation workflow."
folders:
  obs_recordings: "00_OBS_Recordings"
  inbox: "01_Inbox"
  working: "02_Working"
  completed: "03_Completed"
naming:
  date_format: "%Y-%m-%d"
  sermon_slug: "sunday_sermon"
  final_video_suffix: "final"
  audio_suffix: "cd"
video:
  output_resolution: "1920x1080"
  intro_duration_seconds: 3
  fade_in_seconds: 1
  fade_out_seconds: 1
  video_codec: "libx264"
  crf: 18
  preset: "medium"
  audio_codec: "aac"
  audio_bitrate: "192k"
audio:
  sample_rate: 44100
  channels: 2
  codec: "pcm_s16le"
youtube_ready:
  copy_final_video: true
  final_video_name: "final.mp4"
demo:
  synthetic_duration_seconds: 1800
privacy:
  note: "No recordings, credentials, upload accounts, or production paths are included."
