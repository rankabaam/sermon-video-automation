# Sermon Video Automation - Example Configuration
#
# This is a sample configuration file for portfolio demonstration.
# It does not contain real church paths, credentials, recordings, or private data.

project:
  name: "Sermon Video Automation"
  description: "Sample workflow for preparing sermon video, thumbnail, and audio outputs."

folders:
  obs_recordings: "00_OBS_Recordings"
  inbox: "01_Inbox"
  working: "02_Working"
  completed: "03_Completed"

output_folders:
  sermon_video: "03_Completed/Sermon_Video"
  cd_audio_wav: "03_Completed/CD_Audio_WAV"
  thumbnail_image: "03_Completed/Thumbnail_Image"
  youtube_ready: "03_Completed/YouTube_Ready"

naming:
  date_format: "%Y-%m-%d"
  sermon_slug: "sunday_sermon"
  final_video_suffix: "final"
  audio_suffix: "cd"
  thumbnail_suffix: "thumbnail"

video:
  output_resolution: "1920x1080"
  intro_duration_seconds: 3
  fade_in_seconds: 1
  fade_out_seconds: 1
  video_codec: "libx264"
  crf: 18
  preset: "medium"
  audio_codec: "aac"
  audio_bitrate: "192k"

audio:
  output_format: "wav"
  sample_rate: 44100
  channels: 2
  codec: "pcm_s16le"

thumbnail:
  width: 1920
  height: 1080
  use_custom_thumbnail_if_available: true

youtube_ready:
  copy_final_video: true
  copy_thumbnail: true
  final_video_name: "final.mp4"
  thumbnail_name: "thumbnail.png"

privacy:
  note: "This configuration uses fictional example paths and generic settings only."
